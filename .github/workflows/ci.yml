name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a run that's superseded by a newer push to the same branch/PR,
# rather than letting stale runs keep going alongside the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that only needs the app's own tooling (no Docker) — kept as
  # one job since these steps form a single logical "does the app pass its
  # own checks" unit, unlike the Docker build below, which validates a
  # meaningfully different thing (containerization, not app correctness).
  checks:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # server's test script (jest via --experimental-vm-modules) and the
      # scripts/ one-offs need a real Node.js binary, separate from Bun —
      # Bun is the package manager/build tool here, not the app's runtime
      # (see DOCKER.md's "Why the server runs on Node, not Bun"). Version
      # matches server/package.json's engines.node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Speeds up re-downloads/re-extracts only — it doesn't change what
      # gets installed (--frozen-lockfile below still resolves strictly
      # against each committed lockfile), so a cache miss just falls back to
      # a normal full install. Never a correctness risk either way.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'client/bun.lock', 'server/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # --frozen-lockfile on all three: fail loudly if a package.json ever
      # drifts from its committed bun.lock, instead of CI silently
      # resolving a different dependency tree than what's actually committed.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install client dependencies
        run: bun install --cwd client --frozen-lockfile

      - name: Install server dependencies
        run: bun install --cwd server --frozen-lockfile

      - name: Server typecheck
        run: bun --cwd=server run typecheck

      - name: Server tests
        run: bun --cwd=server run test

      - name: Client lint
        run: bun --cwd=client run lint

      - name: Client build
        run: bun --cwd=client run build

  # Separate job: validates the images actually build, not the app's source
  # correctness (that's `checks` above) — a genuinely different failure mode
  # worth its own pass/fail signal, and it needs neither Bun nor Node on the
  # runner itself (each Dockerfile installs/builds with Bun *inside* its own
  # build stages). PR-only: on a push to main, docker-publish below builds
  # (and pushes) these same images, so running this too would just build
  # everything twice.
  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # No .env needed and none is created here — `docker compose build`
      # only builds images (each service's own tsc/vite build steps), it
      # never reads env_file or requires real secrets; only `up`/`run` do.
      # Verified locally: this succeeds with no .env file present at all.
      # Not pushing/deploying anything — build-only, as requested.
      - name: Build client + server images
        run: docker compose build

  # Separate job: real full-stack Playwright tests (build + boot server and
  # client, seed a Mongo database, drive a real browser), a much heavier and
  # slower kind of check than `checks` above — kept independent so a slow or
  # flaky e2e run doesn't block seeing the fast unit/build signals, and vice
  # versa. Runs in parallel with the other jobs (no `needs:`).
  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    services:
      # GitHub's job-level `services:` maps this container's port to the
      # runner's own 127.0.0.1, which is exactly what e2e/env.ts's hardcoded
      # MONGO_URI (mongodb://127.0.0.1:27017/nirvana-cms-e2e) expects — no
      # env var wiring needed here, that value is a TS constant, not read
      # from process.env. GitHub waits for the health check below to pass
      # before running any job steps, so no manual "wait for mongo" step
      # is needed either.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'client/bun.lock', 'server/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Root install matters here specifically (unlike in `checks`, where
      # it's not consumed by anything) — @playwright/test and the
      # `test:e2e` script it runs both live in the root package.json.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install client dependencies
        run: bun install --cwd client --frozen-lockfile

      - name: Install server dependencies
        run: bun install --cwd server --frozen-lockfile

      # Browser binary cache only — the OS-level --with-deps apt packages
      # below aren't part of this cache directory and still install fresh
      # on every run regardless (each job gets an ephemeral runner VM), so
      # a cache miss here just means a slower but still-correct download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # playwright.config.ts's project and e2e/global-setup.ts's manual
      # browser launch both use channel: 'chrome' (real Google Chrome, not
      # the default open-source Chromium build) — `chrome`, not `chromium`,
      # is the channel that needs installing here to match.
      - name: Install Chrome + OS dependencies
        run: npx playwright install --with-deps chrome

      - name: Run Playwright e2e tests
        run: bun run test:e2e

      # global-setup.ts's storageState + Playwright's own trace/screenshot
      # output land under e2e/test-results (playwright.config.ts's
      # outputDir) and e2e/playwright-report — only useful, and only
      # present, when something actually failed.
      - name: Upload Playwright traces/test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: warn
          retention-days: 7

  # Push-to-main only: gated behind checks + e2e (needs:) so nothing ever
  # gets published from a commit that failed typecheck/test/lint/build or the
  # real e2e suite. Doesn't depend on docker-build — this job builds the same
  # images itself, so on a push docker-build's plain `docker compose build`
  # would be redundant work; PRs get that build-validation signal from
  # docker-build instead, since this job doesn't run there.
  docker-publish:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # This job only runs on push-to-main (see the job-level `if:` above),
      # so this condition and the `push:` inputs below are always true in
      # practice — kept explicit rather than assumed, in case the job-level
      # gate is ever loosened.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/mustapha-hamze/nirvana-cms-server:latest
            ghcr.io/mustapha-hamze/nirvana-cms-server:${{ github.sha }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/mustapha-hamze/nirvana-cms-client:latest
            ghcr.io/mustapha-hamze/nirvana-cms-client:${{ github.sha }}

  # Push-to-main only, after GHCR images are published. The VPS already owns
  # its production docker-compose.yml and .env under VPS_DEPLOY_PATH; this job
  # only pulls the new images and restarts the existing stack.
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-publish]
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy latest images
        run: |
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            docker compose pull
            docker compose up -d
            docker compose ps
            curl -fsS http://localhost/api/health
          '
