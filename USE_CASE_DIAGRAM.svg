<svg width="1800" height="980" viewBox="0 0 1800 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Nirvana CMS use case diagram</title>
  <desc id="diagram-desc">A color-coded use case diagram for Nirvana CMS actors, admin panel use cases, and content delivery API use cases.</desc>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b" />
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 14px; font-weight: 500; fill: #475569; }
      .section-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 16px; font-weight: 600; fill: #1e293b; }
      .small { font-size: 13px; font-weight: 500; fill: #475569; }
      .actor-text { font-size: 17px; font-weight: 700; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.5; }
      .actor-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .admin-panel { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2.5; }
      .delivery-panel { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
      .admin-box { fill: #ffffff; stroke: #8b5cf6; stroke-width: 2.5; }
      .delivery-box { fill: #ffffff; stroke: #ea580c; stroke-width: 2.5; }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 3.6; marker-end: url(#arrow-purple); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 3.6; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #16a34a; stroke-width: 3.6; marker-end: url(#arrow-green); }
      .orange-line { fill: none; stroke: #ea580c; stroke-width: 3.6; marker-end: url(#arrow-orange); }
      .include-line { fill: none; stroke: #64748b; stroke-width: 2.6; stroke-dasharray: 8 7; marker-end: url(#arrow-slate); }
      .legend-text { font-size: 14px; font-weight: 600; fill: #334155; }
    </style>
  </defs>

  <rect x="24" y="24" width="1752" height="932" rx="24" class="panel" />
  <text x="70" y="76" class="title">Nirvana CMS Use Case Diagram</text>
  <text x="70" y="104" class="subtitle">Multi-tenant headless CMS for applications, multilingual content, dynamic pages, media, and public delivery.</text>

