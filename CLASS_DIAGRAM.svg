<svg width="1900" height="1220" viewBox="0 0 1900 1220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Nirvana CMS class diagram</title>
  <desc id="diagram-desc">A color-coded class diagram for the Nirvana CMS domain model, showing application tenancy, users, taxonomy, content, pages, and embedded dynamic structures.</desc>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b" />
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #475569; }
      .group-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .class-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .stereo { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: .5px; }
      .field { font-size: 14px; font-weight: 500; fill: #334155; }
      .note { font-size: 13px; font-weight: 600; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.5; }
      .tenant-panel { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
      .taxonomy-panel { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; }
      .content-panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .page-panel { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
      .embedded-panel { fill: #f8fafc; stroke: #64748b; stroke-width: 2.5; }
      .tenant-class { fill: #ffffff; stroke: #7c3aed; stroke-width: 2.5; }
      .taxonomy-class { fill: #ffffff; stroke: #16a34a; stroke-width: 2.5; }
      .content-class { fill: #ffffff; stroke: #2563eb; stroke-width: 2.5; }
      .page-class { fill: #ffffff; stroke: #ea580c; stroke-width: 2.5; }
      .embedded-class { fill: #ffffff; stroke: #64748b; stroke-width: 2.5; }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 3.2; marker-end: url(#arrow-purple); }
      .green-line { fill: none; stroke: #16a34a; stroke-width: 3.2; marker-end: url(#arrow-green); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 3.2; marker-end: url(#arrow-blue); }
      .orange-line { fill: none; stroke: #ea580c; stroke-width: 3.2; marker-end: url(#arrow-orange); }
      .slate-line { fill: none; stroke: #64748b; stroke-width: 2.6; stroke-dasharray: 8 7; marker-end: url(#arrow-slate); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
      .card-shadow { filter: drop-shadow(0 3px 5px rgba(15, 23, 42, .08)); }
    </style>
  </defs>

  <rect x="24" y="24" width="1852" height="1172" rx="26" class="panel" />
  <text x="70" y="78" class="title">Nirvana CMS Class Diagram</text>
  <text x="70" y="108" class="subtitle">Persistent domain classes and embedded document structures for the multi-tenant headless CMS.</text>

  <rect x="64" y="150" width="520" height="585" rx="24" class="tenant-panel" />
  <text x="92" y="188" class="group-title">Identity &amp; Tenant Boundary</text>

  <g class="card-shadow">
    <rect x="92" y="220" width="218" height="210" rx="16" class="tenant-class" />
    <text x="120" y="250" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="120" y="278" class="class-title">Application</text>
    <line x1="92" y1="292" x2="310" y2="292" class="divider" />
    <text x="116" y="320" class="field">name: string</text>
    <text x="116" y="344" class="field">description: string</text>
    <text x="116" y="368" class="field">logo: string | null</text>
    <text x="116" y="392" class="field">status: active | inactive</text>
    <text x="116" y="416" class="field">appKey: immutable string</text>
  </g>

  <g class="card-shadow">
    <rect x="342" y="210" width="212" height="150" rx="16" class="tenant-class" />
    <text x="370" y="240" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="370" y="268" class="class-title">ApplicationSetting</text>
    <line x1="342" y1="282" x2="554" y2="282" class="divider" />
    <text x="366" y="310" class="field">domain: string</text>
    <text x="366" y="334" class="field">languages: LangKey[]</text>
    <text x="366" y="358" class="field">aiApiKey: private string</text>
  </g>

  <g class="card-shadow">
    <rect x="342" y="382" width="212" height="72" rx="16" class="tenant-class" />
    <text x="370" y="412" class="stereo">&lt;&lt;Enum&gt;&gt;</text>
    <text x="370" y="438" class="class-title">LangKey: en | fa | fr</text>
  </g>

  <g class="card-shadow">
    <rect x="92" y="520" width="260" height="190" rx="16" class="tenant-class" />
    <text x="120" y="550" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="120" y="578" class="class-title">User</text>
    <line x1="92" y1="592" x2="352" y2="592" class="divider" />
    <text x="116" y="620" class="field">email: unique string</text>
    <text x="116" y="644" class="field">password: hashed string</text>
    <text x="116" y="668" class="field">role: Role</text>
    <text x="116" y="692" class="field">applications: ObjectId[]</text>
  </g>

  <g class="card-shadow">
    <rect x="382" y="540" width="202" height="170" rx="16" class="tenant-class" />
    <text x="410" y="570" class="stereo">&lt;&lt;Enum&gt;&gt;</text>
    <text x="410" y="596" class="class-title">Role</text>
    <line x1="382" y1="610" x2="584" y2="610" class="divider" />
    <text x="406" y="638" class="field">SuperAdmin</text>
    <text x="406" y="662" class="field">WebSiteAdmin</text>
    <text x="406" y="686" class="field">ContentCreator</text>
  </g>

  <rect x="638" y="150" width="500" height="400" rx="24" class="taxonomy-panel" />
  <text x="666" y="188" class="group-title">Taxonomy</text>

  <g class="card-shadow">
    <rect x="666" y="220" width="210" height="190" rx="16" class="taxonomy-class" />
    <text x="694" y="250" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="694" y="278" class="class-title">Category</text>
    <line x1="666" y1="292" x2="876" y2="292" class="divider" />
    <text x="690" y="320" class="field">application: ObjectId</text>
    <text x="690" y="344" class="field">publicId: string</text>
    <text x="690" y="368" class="field">translations: Translation[]</text>
    <text x="690" y="392" class="field">parentId: Category | null</text>
  </g>

  <g class="card-shadow">
    <rect x="908" y="220" width="202" height="166" rx="16" class="taxonomy-class" />
    <text x="936" y="250" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="936" y="278" class="class-title">Tag</text>
    <line x1="908" y1="292" x2="1110" y2="292" class="divider" />
    <text x="932" y="320" class="field">application: ObjectId</text>
    <text x="932" y="344" class="field">publicId: string</text>
    <text x="932" y="368" class="field">translations: Translation[]</text>
  </g>

  <g class="card-shadow">
    <rect x="780" y="424" width="230" height="92" rx="16" class="embedded-class" />
    <text x="808" y="454" class="stereo">&lt;&lt;Embedded&gt;&gt;</text>
    <text x="808" y="480" class="class-title">Translation</text>
    <text x="808" y="504" class="field">langKey, title, slug</text>
  </g>

  <rect x="64" y="760" width="840" height="385" rx="24" class="content-panel" />
  <text x="92" y="798" class="group-title">Content Domain</text>

  <g class="card-shadow">
    <rect x="92" y="835" width="230" height="170" rx="16" class="content-class" />
    <text x="120" y="865" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="120" y="893" class="class-title">Content</text>
    <line x1="92" y1="907" x2="322" y2="907" class="divider" />
    <text x="116" y="935" class="field">application: ObjectId</text>
    <text x="116" y="959" class="field">categories: Category[]</text>
    <text x="116" y="983" class="field">tags: Tag[]</text>
  </g>

  <g class="card-shadow">
    <rect x="370" y="812" width="250" height="220" rx="16" class="content-class" />
    <text x="398" y="842" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="398" y="870" class="class-title">ContentDetails</text>
    <line x1="370" y1="884" x2="620" y2="884" class="divider" />
    <text x="394" y="912" class="field">content: ObjectId</text>
    <text x="394" y="936" class="field">application: ObjectId</text>
    <text x="394" y="960" class="field">langKey: LangKey</text>
    <text x="394" y="984" class="field">title, slug, headline</text>
    <text x="394" y="1008" class="field">status, publishedAt</text>
  </g>

  <g class="card-shadow">
    <rect x="666" y="812" width="210" height="148" rx="16" class="embedded-class" />
    <text x="694" y="842" class="stereo">&lt;&lt;Embedded&gt;&gt;</text>
    <text x="694" y="870" class="class-title">Metadata</text>
    <line x1="666" y1="884" x2="876" y2="884" class="divider" />
    <text x="690" y="912" class="field">keywords: string[]</text>
    <text x="690" y="936" class="field">author, description</text>
  </g>

  <g class="card-shadow">
    <rect x="666" y="980" width="210" height="142" rx="16" class="embedded-class" />
    <text x="694" y="1010" class="stereo">&lt;&lt;Embedded&gt;&gt;</text>
    <text x="694" y="1038" class="class-title">ContentSection</text>
    <line x1="666" y1="1052" x2="876" y2="1052" class="divider" />
    <text x="690" y="1080" class="field">type: SectionType</text>
    <text x="690" y="1104" class="field">elements: ContentElement[]</text>
  </g>

  <rect x="954" y="760" width="860" height="385" rx="24" class="page-panel" />
  <text x="982" y="798" class="group-title">Page Domain</text>

  <g class="card-shadow">
    <rect x="982" y="835" width="220" height="146" rx="16" class="page-class" />
    <text x="1010" y="865" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="1010" y="893" class="class-title">Page</text>
    <line x1="982" y1="907" x2="1202" y2="907" class="divider" />
    <text x="1006" y="935" class="field">application: ObjectId</text>
    <text x="1006" y="959" class="field">isHomepage: boolean</text>
  </g>

  <g class="card-shadow">
    <rect x="1244" y="812" width="250" height="220" rx="16" class="page-class" />
    <text x="1272" y="842" class="stereo">&lt;&lt;Mongoose Model&gt;&gt;</text>
    <text x="1272" y="870" class="class-title">PageDetails</text>
    <line x1="1244" y1="884" x2="1494" y2="884" class="divider" />
    <text x="1268" y="912" class="field">page: ObjectId</text>
    <text x="1268" y="936" class="field">application: ObjectId</text>
    <text x="1268" y="960" class="field">langKey: LangKey</text>
    <text x="1268" y="984" class="field">title, slug, status</text>
    <text x="1268" y="1008" class="field">metadata, sections</text>
  </g>

  <g class="card-shadow">
    <rect x="1538" y="812" width="230" height="142" rx="16" class="embedded-class" />
    <text x="1566" y="842" class="stereo">&lt;&lt;Embedded&gt;&gt;</text>
    <text x="1566" y="870" class="class-title">PageSection</text>
    <line x1="1538" y1="884" x2="1768" y2="884" class="divider" />
    <text x="1562" y="912" class="field">title: string</text>
    <text x="1562" y="936" class="field">isVisible: boolean</text>
    <text x="1562" y="960" class="field">components: PageComponent[]</text>
  </g>

  <g class="card-shadow">
    <rect x="1538" y="990" width="230" height="140" rx="16" class="embedded-class" />
    <text x="1566" y="1020" class="stereo">&lt;&lt;Embedded&gt;&gt;</text>
    <text x="1566" y="1048" class="class-title">PageComponent</text>
    <line x1="1538" y1="1062" x2="1768" y2="1062" class="divider" />
    <text x="1562" y="1090" class="field">type: ComponentType</text>
    <text x="1562" y="1114" class="field">elements: PageElement[]</text>
  </g>

  <rect x="1188" y="150" width="626" height="448" rx="24" class="embedded-panel" />
  <text x="1216" y="188" class="group-title">Dynamic Element Catalogs</text>

  <g class="card-shadow">
    <rect x="1224" y="230" width="258" height="190" rx="16" class="content-class" />
    <text x="1252" y="260" class="stereo">&lt;&lt;Discriminated Union&gt;&gt;</text>
    <text x="1252" y="288" class="class-title">ContentElement</text>
    <line x1="1224" y1="302" x2="1482" y2="302" class="divider" />
    <text x="1248" y="330" class="field">paragraph, richText</text>
    <text x="1248" y="354" class="field">heading, textInput</text>
    <text x="1248" y="378" class="field">image, imageGallery</text>
    <text x="1248" y="402" class="field">link, videoEmbed</text>
  </g>

  <g class="card-shadow">
    <rect x="1518" y="230" width="258" height="244" rx="16" class="page-class" />
    <text x="1546" y="260" class="stereo">&lt;&lt;Discriminated Union&gt;&gt;</text>
    <text x="1546" y="288" class="class-title">PageElement</text>
    <line x1="1518" y1="302" x2="1776" y2="302" class="divider" />
    <text x="1542" y="330" class="field">richText, image, video</text>
    <text x="1542" y="354" class="field">slide, banner, card</text>
    <text x="1542" y="378" class="field">tab, accordionItem</text>
    <text x="1542" y="402" class="field">pricingPlan, teamMember</text>
    <text x="1542" y="426" class="field">chartData, galleryItem</text>
    <text x="1542" y="450" class="field">cta, stat, map, feature</text>
  </g>

  <g class="card-shadow">
    <rect x="1224" y="462" width="258" height="92" rx="16" class="embedded-class" />
    <text x="1252" y="492" class="stereo">&lt;&lt;Validation Rules&gt;&gt;</text>
    <text x="1252" y="520" class="class-title">SECTION_LAYOUTS</text>
    <text x="1252" y="544" class="field">slot count, order, type</text>
  </g>

  <g class="card-shadow">
    <rect x="1518" y="506" width="258" height="92" rx="16" class="embedded-class" />
    <text x="1546" y="536" class="stereo">&lt;&lt;Validation Rules&gt;&gt;</text>
    <text x="1546" y="564" class="class-title">PAGE_COMPONENT_LAYOUTS</text>
    <text x="1546" y="588" class="field">element type, min, max</text>
  </g>

  <path d="M310 292 C325 292, 325 285, 342 285" class="purple-line" />
  <text x="314" y="278" class="note">1 to 1</text>
  <path d="M222 520 C222 482, 222 470, 222 430" class="purple-line" />
  <text x="236" y="500" class="note">assigned apps</text>
  <path d="M352 610 C364 610, 368 606, 382 606" class="purple-line" />
  <text x="356" y="592" class="note">role</text>

  <path d="M876 385 C885 420, 885 420, 885 424" class="slate-line" />
  <path d="M1009 386 C982 420, 960 424, 936 424" class="slate-line" />
  <path d="M771 410 C725 452, 721 452, 666 392" class="green-line" />
  <text x="684" y="444" class="note">parent category</text>

  <path d="M322 910 C344 910, 348 910, 370 910" class="blue-line" />
  <text x="330" y="895" class="note">1 to many</text>
  <path d="M620 922 C642 922, 642 876, 666 876" class="slate-line" />
  <path d="M620 965 C642 965, 642 1038, 666 1038" class="slate-line" />

  <path d="M1202 898 C1224 898, 1224 900, 1244 900" class="orange-line" />
  <text x="1208" y="883" class="note">1 to many</text>
  <path d="M1494 910 C1516 910, 1516 883, 1538 883" class="slate-line" />
  <path d="M1494 952 C1514 952, 1518 1035, 1538 1035" class="slate-line" />
  <path d="M1768 1045 C1810 1045, 1810 883, 1768 883" class="slate-line" />

  <rect x="64" y="1162" width="672" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="90" y1="1173" x2="130" y2="1173" class="purple-line" />
  <text x="142" y="1178" class="note">tenant / identity</text>
  <line x1="286" y1="1173" x2="326" y2="1173" class="green-line" />
  <text x="338" y="1178" class="note">taxonomy</text>
  <line x1="452" y1="1173" x2="492" y2="1173" class="blue-line" />
  <text x="504" y="1178" class="note">content</text>
  <line x1="610" y1="1173" x2="650" y2="1173" class="orange-line" />
  <text x="662" y="1178" class="note">pages</text>
</svg>
