server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse-proxy API and uploaded-media requests to the server container.
    # proxy_pass has no path component here, so nginx forwards the client's
    # original request URI unchanged (e.g. /api/health -> server:5001/api/health)
    # instead of rewriting based on the location prefix — avoids trailing-slash
    # rewrite subtleties for nested paths like /storage/images/pages/<file>.
    location /api/ {
        proxy_pass http://server:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://server:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploaded media can be large (video); don't buffer the whole
        # response in memory before streaming it to the client.
        proxy_buffering off;
    }

    # React Router (client-side routing) fallback: any path that isn't a real
    # static file resolves to index.html so the SPA's router can take over.
    #
    # Headers scoped to this location only, not the server block — /api/ and
    # /storage/ are proxied straight to the server, which already sets its
    # own (helmet-provided) versions of these; adding them at the server
    # level would double-stamp proxied responses with two conflicting values
    # for the same header (e.g. X-Frame-Options: SAMEORIGIN from helmet and
    # DENY from here, sent together).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
