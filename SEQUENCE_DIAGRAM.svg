<svg width="1900" height="1460" viewBox="0 0 1900 1460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Nirvana CMS sequence diagram</title>
  <desc id="diagram-desc">A clear, colorful sequence diagram showing authentication, admin editing, media upload, save and publish, and public frontend delivery flows in Nirvana CMS.</desc>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b" />
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #475569; }
      .phase-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .participant-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .participant-subtitle { font-size: 12px; font-weight: 600; fill: #64748b; }
      .message { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .note { font-size: 13px; font-weight: 600; fill: #475569; }
      .small { font-size: 12px; font-weight: 600; fill: #64748b; }
      .canvas { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.5; }
      .phase-auth { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .phase-admin { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .phase-media { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .phase-public { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .lane { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .actor-box { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
      .client-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .api-box { fill: #ffffff; stroke: #64748b; stroke-width: 2.5; }
      .db-box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; }
      .storage-box { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
      .public-box { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrow-purple); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #16a34a; stroke-width: 3; marker-end: url(#arrow-green); }
      .orange-line { fill: none; stroke: #ea580c; stroke-width: 3; marker-end: url(#arrow-orange); }
      .slate-line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-slate); }
      .return-line { fill: none; stroke: #64748b; stroke-width: 2.3; stroke-dasharray: 7 6; marker-end: url(#arrow-slate); }
      .legend-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="24" y="24" width="1852" height="1412" rx="26" class="canvas" />
  <text x="70" y="78" class="title">Nirvana CMS Sequence Diagram</text>
  <text x="70" y="108" class="subtitle">End-to-end runtime flow for admin authoring, media upload, publishing, and public content delivery.</text>

  <rect x="70" y="142" width="220" height="74" rx="18" class="actor-box" />
  <text x="115" y="172" class="participant-title">Admin User</text>
  <text x="98" y="194" class="participant-subtitle">SuperAdmin / WebsiteAdmin / Creator</text>

  <rect x="355" y="142" width="220" height="74" rx="18" class="client-box" />
  <text x="405" y="172" class="participant-title">React Admin Panel</text>
  <text x="412" y="194" class="participant-subtitle">Vite client + local drafts</text>

  <rect x="650" y="142" width="220" height="74" rx="18" class="api-box" />
  <text x="700" y="172" class="participant-title">Express Admin API</text>
  <text x="692" y="194" class="participant-subtitle">controllers + services</text>

  <rect x="940" y="142" width="220" height="74" rx="18" class="api-box" />
  <text x="995" y="172" class="participant-title">Auth / RBAC</text>
  <text x="977" y="194" class="participant-subtitle">JWT + app access checks</text>

  <rect x="1225" y="142" width="220" height="74" rx="18" class="db-box" />
  <text x="1290" y="172" class="participant-title">MongoDB</text>
  <text x="1268" y="194" class="participant-subtitle">Mongoose models</text>

  <rect x="1450" y="142" width="180" height="74" rx="18" class="storage-box" />
  <text x="1493" y="172" class="participant-title">Storage</text>
  <text x="1474" y="194" class="participant-subtitle">/storage files</text>

  <rect x="1660" y="142" width="170" height="74" rx="18" class="public-box" />
  <text x="1684" y="172" class="participant-title">Public Website</text>
  <text x="1675" y="194" class="participant-subtitle">frontend app</text>

  <line x1="180" y1="216" x2="180" y2="1375" class="lane" />
  <line x1="465" y1="216" x2="465" y2="1375" class="lane" />
  <line x1="760" y1="216" x2="760" y2="1375" class="lane" />
  <line x1="1050" y1="216" x2="1050" y2="1375" class="lane" />
  <line x1="1335" y1="216" x2="1335" y2="1375" class="lane" />
  <line x1="1540" y1="216" x2="1540" y2="1375" class="lane" />
  <line x1="1745" y1="216" x2="1745" y2="1375" class="lane" />

  <rect x="95" y="250" width="1660" height="245" rx="20" class="phase-auth" opacity="0.58" />
  <text x="120" y="282" class="phase-title">1. Authentication and Session Bootstrap</text>

  <rect x="456" y="310" width="18" height="138" rx="8" class="activation" />
  <rect x="751" y="344" width="18" height="96" rx="8" class="activation" />
  <rect x="1041" y="378" width="18" height="56" rx="8" class="activation" />
  <rect x="1326" y="392" width="18" height="38" rx="8" class="activation" />

  <path d="M180 322 L455 322" class="purple-line" />
  <text x="218" y="312" class="message">Enter email and password</text>
  <path d="M474 356 L751 356" class="blue-line" />
  <text x="510" y="346" class="message">POST /api/auth/login</text>
  <path d="M769 388 L1041 388" class="slate-line" />
  <text x="806" y="378" class="message">verify JWT secret rules later</text>
  <path d="M1059 414 L1326 414" class="green-line" />
  <text x="1098" y="404" class="message">User.findOne + comparePassword</text>
  <path d="M1326 436 L769 436" class="return-line" />
  <text x="1074" y="458" class="message">user document + applications</text>
  <path d="M751 466 L474 466" class="return-line" />
  <text x="515" y="488" class="message">JWT token + user context</text>

  <rect x="95" y="535" width="1660" height="345" rx="20" class="phase-admin" opacity="0.58" />
  <text x="120" y="568" class="phase-title">2. Admin Editing: Application, Content, Pages, Translations</text>

  <rect x="456" y="610" width="18" height="205" rx="8" class="activation" />
  <rect x="751" y="642" width="18" height="150" rx="8" class="activation" />
  <rect x="1041" y="666" width="18" height="92" rx="8" class="activation" />
  <rect x="1326" y="690" width="18" height="70" rx="8" class="activation" />

  <path d="M180 620 L455 620" class="purple-line" />
  <text x="215" y="610" class="message">Open application editor</text>
  <path d="M474 654 L751 654" class="blue-line" />
  <text x="504" y="644" class="message">GET /applications/:id</text>
  <path d="M769 682 L1041 682" class="slate-line" />
  <text x="812" y="672" class="message">authenticate + require app access</text>
  <path d="M1059 714 L1326 714" class="green-line" />
  <text x="1116" y="704" class="message">Application + settings lookup</text>
  <path d="M1326 742 L769 742" class="return-line" />
  <text x="1086" y="764" class="message">application, languages</text>
  <path d="M474 792 L180 792" class="return-line" />
  <text x="215" y="814" class="message">Render editor and local language drafts</text>

  <rect x="120" y="824" width="815" height="38" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
  <text x="148" y="849" class="note">Client edits per-language drafts for ContentDetails or PageDetails before saving.</text>

  <rect x="95" y="920" width="1660" height="185" rx="20" class="phase-media" opacity="0.58" />
  <text x="120" y="952" class="phase-title">3. Media Upload: Images, Videos, Documents</text>

  <rect x="456" y="984" width="18" height="70" rx="8" class="activation" />
  <rect x="751" y="1004" width="18" height="72" rx="8" class="activation" />
  <rect x="1531" y="1030" width="18" height="36" rx="8" class="activation" />

  <path d="M180 990 L455 990" class="purple-line" />
  <text x="222" y="980" class="message">Select file in editor</text>
  <path d="M474 1020 L751 1020" class="green-line" />
  <text x="502" y="1010" class="message">POST /content/images or /pages/images</text>
  <path d="M769 1046 L1531 1046" class="green-line" />
  <text x="1040" y="1036" class="message">process / validate and write file</text>
  <path d="M1531 1074 L474 1074" class="return-line" />
  <text x="925" y="1094" class="message">bare filename for persisted body field</text>

  <rect x="95" y="1145" width="1118" height="220" rx="20" class="phase-admin" opacity="0.58" />
  <text x="120" y="1177" class="phase-title">4. Save and Publish Content or Page</text>

  <rect x="456" y="1212" width="18" height="96" rx="8" class="activation" />
  <rect x="751" y="1232" width="18" height="108" rx="8" class="activation" />
  <rect x="1041" y="1254" width="18" height="60" rx="8" class="activation" />
  <rect x="1326" y="1290" width="18" height="46" rx="8" class="activation" />

  <path d="M180 1220 L455 1220" class="purple-line" />
  <text x="215" y="1210" class="message">Click Save / Publish</text>
  <path d="M474 1248 L751 1248" class="blue-line" />
  <text x="493" y="1238" class="message">PUT /content/:id/details/:langKey</text>
  <text x="520" y="1260" class="small">or PUT /pages/:id/details/:langKey</text>
  <path d="M769 1278 L1041 1278" class="slate-line" />
  <text x="820" y="1268" class="message">authenticate + app role gate</text>
  <path d="M769 1312 L1326 1312" class="green-line" />
  <text x="882" y="1302" class="message">validate sections/components, slug, status, metadata</text>
  <path d="M1326 1342 L769 1342" class="return-line" />
  <text x="1042" y="1360" class="message">saved detail, publishedAt if published</text>

  <rect x="1250" y="1145" width="505" height="220" rx="20" class="phase-public" opacity="0.68" />
  <text x="1275" y="1177" class="phase-title">5. Public Content Delivery</text>

  <rect x="1736" y="1234" width="18" height="88" rx="8" class="activation" />
  <rect x="751" y="1234" width="18" height="88" rx="8" class="activation" opacity=".45" />
  <rect x="1326" y="1262" width="18" height="50" rx="8" class="activation" opacity=".45" />

  <path d="M1736 1220 L769 1220" class="orange-line" />
  <text x="1110" y="1210" class="message">GET /api/frontend/pages/:slug?appKey=&amp;lang=</text>
  <path d="M769 1252 L1326 1252" class="green-line" />
  <text x="875" y="1242" class="message">resolve active app, language, published detail</text>
  <path d="M1326 1300 L769 1300" class="return-line" />
  <text x="1016" y="1320" class="message">settings + published content/page shape</text>
  <path d="M769 1340 L1736 1340" class="return-line" />
  <text x="1108" y="1360" class="message">JSON for public renderer</text>

  <rect x="70" y="1388" width="720" height="28" rx="14" class="legend-box" />
  <line x1="95" y1="1403" x2="135" y2="1403" class="purple-line" />
  <text x="148" y="1408" class="note">user action</text>
  <line x1="275" y1="1403" x2="315" y2="1403" class="blue-line" />
  <text x="328" y="1408" class="note">admin HTTP</text>
  <line x1="485" y1="1403" x2="525" y2="1403" class="green-line" />
  <text x="538" y="1408" class="note">database / storage</text>
  <line x1="675" y1="1403" x2="715" y2="1403" class="orange-line" />
  <text x="728" y="1408" class="note">public delivery</text>
</svg>
